<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院规划测算计算器 (Liquid Glass Design)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Animations & Colors -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fadeIn': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbar for nicer look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons Adapter ---
        // 将 Lucide 全局对象转换为 React 组件
        const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
            const iconName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            
            useEffect(() => {
                lucide.createIcons();
            }, [name]);

            return <i data-lucide={iconName} width={size} height={size} className={className} {...props}></i>;
        };

        // 映射原有组件名
        const Calculator = (p) => <LucideIcon name="Calculator" {...p} />;
        const Activity = (p) => <LucideIcon name="Activity" {...p} />;
        const Bed = (p) => <LucideIcon name="Bed" {...p} />;
        const Layout = (p) => <LucideIcon name="Layout" {...p} />;
        const Building2 = (p) => <LucideIcon name="Building2" {...p} />;
        const Info = (p) => <LucideIcon name="Info" {...p} />;
        const Users = (p) => <LucideIcon name="Users" {...p} />;
        const Stethoscope = (p) => <LucideIcon name="Stethoscope" {...p} />;
        const ArrowRight = (p) => <LucideIcon name="ArrowRight" {...p} />;
        const X = (p) => <LucideIcon name="X" {...p} />;
        const Sun = (p) => <LucideIcon name="Sun" {...p} />;
        const Moon = (p) => <LucideIcon name="Moon" {...p} />;
        const Monitor = (p) => <LucideIcon name="Monitor" {...p} />;
        const Check = (p) => <LucideIcon name="Check" {...p} />;

        // --- Components ---

        const GlassCard = ({ children, className = "" }) => (
            <div className={`
                relative overflow-hidden rounded-2xl border transition-all duration-300
                bg-white/60 dark:bg-slate-900/60 
                backdrop-blur-xl 
                border-white/40 dark:border-white/10
                shadow-lg dark:shadow-black/20
                ${className}
            `}>
                <div className="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/50 to-transparent opacity-50 dark:opacity-20 pointer-events-none" />
                {children}
            </div>
        );

        const SectionHeader = ({ icon: Icon, title, description }) => (
            <div className="flex items-start gap-4 mb-6 border-b border-slate-200/50 dark:border-slate-700/50 pb-4">
                <div className="p-3 bg-gradient-to-br from-blue-500 to-purple-600 text-white rounded-xl shadow-lg shadow-blue-500/30 mt-1">
                    <Icon size={24} />
                </div>
                <div>
                    <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100">{title}</h2>
                    <p className="text-sm text-slate-600 dark:text-slate-400 mt-1">{description}</p>
                </div>
            </div>
        );

        const FormulaTag = ({ children }) => (
            <div className="inline-flex items-center gap-1 mt-2 px-2.5 py-1 
                bg-slate-100/50 dark:bg-slate-800/50 
                border border-slate-200/50 dark:border-slate-700/50 
                rounded-md text-[11px] font-mono text-slate-500 dark:text-slate-400 leading-tight backdrop-blur-sm">
                <span className="font-serif italic text-slate-400 dark:text-slate-500">fx:</span> {children}
            </div>
        );

        const InputGroup = ({ label, value, onChange, unit, hint, min, max, step = 1 }) => (
            <div className="mb-5 group relative z-10">
                <div className="flex justify-between mb-1.5 px-1">
                    <label className="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">{label}</label>
                </div>
                <div className="relative">
                    <input
                        type="number"
                        value={value}
                        onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
                        className="w-full px-4 py-2.5 
                        bg-white/50 dark:bg-slate-800/50 
                        border border-slate-200/60 dark:border-slate-700/60 
                        rounded-xl backdrop-blur-sm
                        focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 
                        text-slate-900 dark:text-white font-medium
                        shadow-sm transition-all duration-200
                        hover:bg-white/80 dark:hover:bg-slate-800/80"
                        min={min}
                        max={max}
                        step={step}
                    />
                    {unit && (
                        <span className="absolute right-4 top-2.5 text-sm text-slate-400 dark:text-slate-500 pointer-events-none font-medium">
                            {unit}
                        </span>
                    )}
                </div>
                {hint && <div className="text-xs text-slate-500 dark:text-slate-500 italic mt-1.5 px-1">{hint}</div>}
            </div>
        );

        const ResultBox = ({ label, value, subtext, highlight = false, formula }) => (
            <div className={`p-5 rounded-xl border flex flex-col justify-between transition-all duration-300 
                ${highlight 
                ? 'bg-gradient-to-br from-blue-50/80 to-indigo-50/80 dark:from-blue-900/30 dark:to-indigo-900/30 border-blue-200/60 dark:border-blue-700/50 shadow-blue-200/20' 
                : 'bg-white/40 dark:bg-slate-800/40 border-slate-200/50 dark:border-slate-700/50'
                } backdrop-blur-md`}>
                <div>
                    <div className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        {label}
                    </div>
                    <div className={`text-3xl font-bold tracking-tight mb-1
                        ${highlight ? 'text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400' : 'text-slate-800 dark:text-slate-100'}`}>
                        {typeof value === 'number' ? value.toLocaleString(undefined, { maximumFractionDigits: 1 }) : value}
                        {subtext && <span className="text-sm font-normal text-slate-500 dark:text-slate-400 ml-2 align-baseline text-black dark:text-white">{subtext}</span>}
                    </div>
                </div>
                {formula && <FormulaTag>{formula}</FormulaTag>}
            </div>
        );

        const ThemeToggle = ({ mode, setMode }) => {
            const options = [
                { key: 'light', icon: Sun, label: 'Light' },
                { key: 'dark', icon: Moon, label: 'Dark' },
                { key: 'system', icon: Monitor, label: 'Auto' },
            ];

            return (
                <div className="flex bg-slate-200/50 dark:bg-slate-800/50 p-1 rounded-full backdrop-blur-md border border-slate-200/50 dark:border-slate-700/50">
                    {options.map((opt) => (
                        <button
                            key={opt.key}
                            onClick={() => setMode(opt.key)}
                            className={`relative p-2 rounded-full transition-all duration-300 ${
                                mode === opt.key 
                                ? 'text-blue-600 dark:text-blue-400 shadow-sm bg-white dark:bg-slate-700' 
                                : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                            }`}
                            title={opt.label}
                        >
                            <opt.icon size={16} />
                        </button>
                    ))}
                </div>
            );
        };

        // --- Main App Logic ---

        function App() {
            const [activeTab, setActiveTab] = useState('outpatient');
            
            // Theme State
            const [themeMode, setThemeMode] = useState('system'); // 'light', 'dark', 'system'
            const [isDark, setIsDark] = useState(false);

            // Theme Logic
            useEffect(() => {
                const checkSystem = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                const applyTheme = () => {
                    let dark = false;
                    if (themeMode === 'system') {
                        dark = checkSystem();
                    } else {
                        dark = themeMode === 'dark';
                    }
                    setIsDark(dark);
                    
                    // Apply to html root for global styles
                    if (dark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                };

                applyTheme();
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = () => { if (themeMode === 'system') applyTheme(); };
                mediaQuery.addEventListener('change', handler);
                return () => mediaQuery.removeEventListener('change', handler);
            }, [themeMode]);

            // --- Global Calculation State ---
            const [totalBeds, setTotalBeds] = useState(1000);

            // --- Outpatient State ---
            const [outpatientRatio, setOutpatientRatio] = useState(3);
            const [doctorHours, setDoctorHours] = useState(7);
            const [patientsPerHour, setPatientsPerHour] = useState(4);
            const [deptRatios, setDeptRatios] = useState({
                internal: 17, surgery: 14, obgyn: 12, pediatrics: 12, ent: 9
            });

            // --- Emergency State ---
            const [emergToOutpatientRatio, setEmergToOutpatientRatio] = useState(10);
            const [emergRoomCapacity, setEmergRoomCapacity] = useState(50);
            const [drConfig, setDrConfig] = useState(0.26);
            const [resusRatio, setResusRatio] = useState(20);
            const [resusConfig, setResusConfig] = useState(0.2);
            const [observationRatio, setObservationRatio] = useState(25);
            const [eicuRatioMethod, setEicuRatioMethod] = useState('total');
            const [eicuTotalRatio, setEicuTotalRatio] = useState(1);
            const [eicuResusRatio, setEicuResusRatio] = useState(50);

            // --- Inpatient State ---
            const [icuRatio, setIcuRatio] = useState(5);
            const [nicuRatio, setNicuRatio] = useState(10);
            const [obstetricsBeds, setObstetricsBeds] = useState(50);
            const [ccuBeds, setCcuBeds] = useState(10);
            const [bedsPerUnit, setBedsPerUnit] = useState(45);

            // --- Area State ---
            const [rooms, setRooms] = useState([{ id: 1, area: 20, count: 10 }]);
            const [trafficCoeff, setTrafficCoeff] = useState(0.35);
            const [wallCoeff, setWallCoeff] = useState(0.10);
            const [wardUnitAreaStandard, setWardUnitAreaStandard] = useState(1650);

            // --- Calculations ---
            const dailyOutpatient = totalBeds * outpatientRatio;
            const singleDocDailyCapacity = doctorHours * patientsPerHour;
            const dailyEmergency = dailyOutpatient * (emergToOutpatientRatio / 100);
            const emergencyRooms = dailyEmergency > 0 ? dailyEmergency / emergRoomCapacity : 0;
            const emergencyEquip = (dailyEmergency / 1000) * drConfig;
            const resusBeds = dailyEmergency * (resusRatio / 100) * resusConfig;
            const obsBeds = dailyEmergency * (observationRatio / 100);
            const eicuBeds = eicuRatioMethod === 'total' ? totalBeds * (eicuTotalRatio / 100) : resusBeds * (eicuResusRatio / 100);
            const icuBedsCalc = totalBeds * (icuRatio / 100);
            const nicuBedsCalc = obstetricsBeds * (nicuRatio / 100);
            const totalSpecialBeds = eicuBeds + icuBedsCalc + nicuBedsCalc + ccuBeds;
            const generalWardBeds = totalBeds - totalSpecialBeds;
            const nursingUnits = generalWardBeds / bedsPerUnit;
            const calculateDeptArea = () => {
                let netArea = 0;
                rooms.forEach(r => netArea += (r.area * r.count));
                return netArea * (1 + trafficCoeff + wallCoeff);
            };
            const deptTotalArea = calculateDeptArea();
            const wardTotalArea = nursingUnits * wardUnitAreaStandard;
            const totalCoeff = 1 + trafficCoeff + wallCoeff;

            // Handlers
            const handleRoomChange = (id, field, val) => {
                setRooms(rooms.map(r => r.id === id ? { ...r, [field]: parseFloat(val) || 0 } : r));
            };
            const addRoom = () => setRooms([...rooms, { id: Date.now(), area: 0, count: 0 }]);
            const removeRoom = (id) => setRooms(rooms.filter(r => r.id !== id));

            return (
                <div className={`transition-colors duration-500 font-sans ${isDark ? 'dark' : ''}`}>
                    {/* Background Blobs Layer */}
                    <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none bg-slate-50 dark:bg-slate-950 transition-colors duration-500">
                        {/* Top Right Blob */}
                        <div className="absolute -top-[20%] -right-[10%] w-[800px] h-[800px] rounded-full bg-gradient-to-br from-purple-200/40 to-blue-200/40 dark:from-purple-900/20 dark:to-blue-900/20 blur-3xl opacity-70 animate-pulse-slow"></div>
                        {/* Bottom Left Blob */}
                        <div className="absolute top-[40%] -left-[10%] w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-pink-200/40 to-orange-100/40 dark:from-pink-900/20 dark:to-orange-900/20 blur-3xl opacity-60"></div>
                        {/* Center Blob */}
                        <div className="absolute bottom-[10%] right-[20%] w-[500px] h-[500px] rounded-full bg-gradient-to-tl from-emerald-100/40 to-teal-100/40 dark:from-emerald-900/20 dark:to-teal-900/20 blur-3xl opacity-60"></div>
                    </div>

                    <div className="relative z-10 min-h-screen p-4 md:p-8 text-slate-800 dark:text-slate-100">
                        <div className="max-w-7xl mx-auto">
                        
                        {/* Header */}
                        <header className="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
                            <div className="flex-1">
                                <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 mb-2 tracking-tight filter drop-shadow-sm">
                                    医院规划测算计算器
                                </h1>
                                <p className="text-slate-600 dark:text-slate-400 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                                    Liquid Glass Design System • v2.0
                                </p>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="hidden md:block text-right">
                                    <div className="text-[10px] uppercase tracking-widest text-slate-400 dark:text-slate-500 font-bold">Theme</div>
                                </div>
                                <ThemeToggle mode={themeMode} setMode={setThemeMode} />
                            </div>
                        </header>

                        {/* Global Input Hero Card */}
                        <GlassCard className="mb-8 p-1 bg-gradient-to-br from-white/40 to-white/10 dark:from-slate-800/40 dark:to-slate-900/10">
                            <div className="p-6 md:p-8 flex flex-col md:flex-row items-center gap-8 relative">
                                <div className="flex items-center gap-6 flex-1 z-10">
                                    <div className="p-5 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white shadow-xl shadow-blue-500/30">
                                        <Building2 size={36} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wide mb-1">Core Parameter</label>
                                        <div className="text-3xl font-black text-slate-800 dark:text-white">医院总床位数</div>
                                        <div className="text-sm text-slate-500 dark:text-slate-400 mt-1 opacity-80">全院计算基础指标数据源</div>
                                    </div>
                                </div>
                                <div className="w-full md:w-1/3 z-10">
                                    <div className="relative group">
                                        <input
                                            type="number"
                                            value={totalBeds}
                                            onChange={(e) => setTotalBeds(parseFloat(e.target.value) || 0)}
                                            className="w-full text-5xl font-black text-right text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400
                                            border-b-2 border-slate-200 dark:border-slate-700 bg-transparent 
                                            focus:border-blue-500 dark:focus:border-blue-400 focus:outline-none py-2 transition-all 
                                            placeholder-slate-300"
                                        />
                                        <span className="absolute right-0 -bottom-6 text-sm text-slate-400 dark:text-slate-500 font-medium">BEDS CAPACITY</span>
                                    </div>
                                </div>
                            </div>
                        </GlassCard>

                        {/* Navigation Tabs */}
                        <div className="flex flex-wrap gap-3 mb-8 p-1.5 bg-white/30 dark:bg-black/20 backdrop-blur-md rounded-xl w-fit mx-auto md:mx-0 border border-white/20 dark:border-white/5">
                            {[
                                { id: 'outpatient', label: '门诊规模', icon: Users },
                                { id: 'emergency', label: '急诊配置', icon: Activity },
                                { id: 'inpatient', label: '住院病房', icon: Bed },
                                { id: 'area', label: '建筑面积', icon: Layout },
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-6 py-2.5 rounded-lg font-bold text-sm transition-all duration-300 ${
                                    activeTab === tab.id
                                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/30 ring-1 ring-white/20'
                                        : 'text-slate-600 dark:text-slate-400 hover:bg-white/40 dark:hover:bg-white/10'
                                    }`}
                                >
                                    <tab.icon size={18} strokeWidth={2.5} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* Main Content */}
                            <div className="lg:col-span-8 space-y-8">
                            
                            {/* 1. OUTPATIENT TAB */}
                            {activeTab === 'outpatient' && (
                                <div className="space-y-6 animate-fadeIn">
                                    <GlassCard className="p-6 md:p-8">
                                        <SectionHeader icon={Users} title="门诊规模测算" description="日门诊量 = 总床位 × 诊床比" />
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8 items-stretch">
                                        <div className="space-y-4">
                                            <InputGroup 
                                            label="诊床比 (日门诊量/床位数)" 
                                            value={outpatientRatio} 
                                            onChange={setOutpatientRatio} 
                                            hint="国标 3:1 | 热门地区 7:1 | 高端私立 1:1"
                                            step={0.1}
                                            />
                                            <div className="p-4 rounded-xl bg-slate-50/50 dark:bg-slate-800/30 border border-slate-200/50 dark:border-slate-700/50 backdrop-blur-sm">
                                            <div className="text-xs text-slate-500 dark:text-slate-400 mb-2">💡 专家建议</div>
                                            <p className="text-xs leading-relaxed text-slate-600 dark:text-slate-300">新建医院建议按 1.5-2.0 预留发展空间，避免初期空置。</p>
                                            </div>
                                        </div>

                                        <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 p-6 text-white shadow-lg shadow-blue-500/20 flex flex-col justify-center">
                                            <div className="absolute top-0 right-0 p-4 opacity-10">
                                            <Users size={120} />
                                            </div>
                                            <div className="relative z-10">
                                            <div className="text-sm font-medium text-blue-100 mb-1">预估日门诊量 (Outpatient/Day)</div>
                                            <div className="text-4xl font-black mb-2 tracking-tight">{dailyOutpatient.toLocaleString()} <span className="text-lg font-medium opacity-70">人次</span></div>
                                            <div className="inline-flex items-center gap-1 bg-white/20 px-2 py-1 rounded text-[10px] font-mono backdrop-blur-md border border-white/20">
                                                fx: 总床位数({totalBeds}) × 诊床比({outpatientRatio})
                                            </div>
                                            </div>
                                        </div>
                                        </div>

                                        <div className="border-t border-slate-200/50 dark:border-slate-700/50 pt-6 mb-6">
                                        <h3 className="text-base font-bold text-slate-800 dark:text-slate-100 mb-6 flex items-center gap-2">
                                            <span className="w-1.5 h-6 bg-blue-500 rounded-full"></span>
                                            诊室效能设定
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                                            <InputGroup label="医生日均工作时长" value={doctorHours} onChange={setDoctorHours} unit="小时" />
                                            <InputGroup label="每小时问诊效率" value={patientsPerHour} onChange={setPatientsPerHour} unit="人/小时" />
                                        </div>
                                        <div className="p-4 rounded-xl bg-blue-50/50 dark:bg-blue-900/10 border border-blue-100/50 dark:border-blue-800/30 flex items-center justify-between">
                                            <span className="text-sm font-bold text-blue-800 dark:text-blue-300">单诊室日接诊能力</span>
                                            <div className="text-right">
                                            <span className="text-2xl font-black text-blue-600 dark:text-blue-400 mr-2">{singleDocDailyCapacity.toFixed(0)}</span>
                                            <span className="text-xs text-blue-400 dark:text-blue-500">人次/间</span>
                                            </div>
                                        </div>
                                        </div>

                                        <div className="overflow-hidden rounded-xl border border-slate-200/50 dark:border-slate-700/50 shadow-sm">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-50/80 dark:bg-slate-800/80 backdrop-blur text-slate-700 dark:text-slate-200 font-bold border-b border-slate-200/50 dark:border-slate-700/50">
                                            <tr>
                                                <th className="px-5 py-4">科室</th>
                                                <th className="px-5 py-4">分科比例 (%)</th>
                                                <th className="px-5 py-4">科室日门诊</th>
                                                <th className="px-5 py-4">所需诊室</th>
                                            </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50 bg-white/40 dark:bg-slate-900/40">
                                            {Object.entries(deptRatios).map(([key, ratio]) => {
                                                const deptVol = dailyOutpatient * (ratio / 100);
                                                const roomsNeeded = Math.ceil(deptVol / singleDocDailyCapacity);
                                                const labels = { internal: '内科', surgery: '外科', obgyn: '妇科', pediatrics: '儿科', ent: '五官科' };
                                                return (
                                                <tr key={key} className="hover:bg-blue-50/30 dark:hover:bg-slate-800/50 transition-colors">
                                                    <td className="px-5 py-3 font-medium text-slate-800 dark:text-slate-200">{labels[key]}</td>
                                                    <td className="px-5 py-3">
