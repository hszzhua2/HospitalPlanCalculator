<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院规划测算计算器 (Pro Edition)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        medical: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300 antialiased selection:bg-medical-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Robust Icon System (No External Script Dependency) ---
        // FIX: Wrapped multi-path icons in Fragments <>...</> to avoid Adjacent JSX elements error
        const Icons = {
            Calculator: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></>,
            Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
            Bed: <><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></>,
            Layout: <><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></>,
            Building2: <><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></>,
            Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
            Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
            Stethoscope: <><path d="M4.8 2.3A.3.3 0 0 1 5 2h14a.3.3 0 0 1 .2.3v3.3a.3.3 0 0 1-.3.3H18a.3.3 0 0 1-.3-.3V4H6v1.4a.3.3 0 0 1-.3.3H4.8a.3.3 0 0 1-.3-.3V2.3zM8 4h8"/><path d="M12 4v10a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2V4"/><circle cx="12" cy="20" r="2"/></>,
            ArrowRight: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
            X: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
            Sun: <><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>,
            Moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
            Monitor: <><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></>,
            Check: <path d="M20 6 9 17l-5-5"/>,
            Map: <><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></>
        };

        const Icon = ({ name, size = 20, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {Icons[name] || <circle cx="12" cy="12" r="10"/>}
            </svg>
        );

        // --- Reusable UI Components ---

        const Card = ({ children, className = "" }) => (
            <div className={`
                bg-white dark:bg-slate-900 
                rounded-2xl border border-slate-200 dark:border-slate-800 
                shadow-sm hover:shadow-md transition-shadow duration-300
                ${className}
            `}>
                {children}
            </div>
        );

        const SectionHeader = ({ iconName, title, description }) => (
            <div className="flex items-start gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
                <div className="p-2.5 bg-medical-50 dark:bg-medical-900/30 text-medical-600 dark:text-medical-400 rounded-xl">
                    <Icon name={iconName} size={24} />
                </div>
                <div>
                    <h2 className="text-lg font-bold text-slate-900 dark:text-white">{title}</h2>
                    <p className="text-sm text-slate-500 dark:text-slate-400">{description}</p>
                </div>
            </div>
        );

        const FormulaTag = ({ children }) => (
            <div className="inline-flex items-center gap-1.5 mt-2 px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-md text-[11px] font-mono text-slate-500 dark:text-slate-400">
                <span className="font-serif italic opacity-50">fx:</span>
                {children}
            </div>
        );

        const InputGroup = ({ label, value, onChange, unit, hint, step = 1, className="" }) => (
            <div className={`mb-4 ${className}`}>
                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1.5">
                    {label}
                </label>
                <div className="relative">
                    <input
                        type="number"
                        value={value}
                        onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
                        step={step}
                        className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white font-medium focus:ring-2 focus:ring-medical-500/20 focus:border-medical-500 outline-none transition-all"
                    />
                    {unit && (
                        <span className="absolute right-4 top-2.5 text-sm text-slate-400 font-medium pointer-events-none">
                            {unit}
                        </span>
                    )}
                </div>
                {hint && <div className="text-xs text-slate-400 mt-1.5">{hint}</div>}
            </div>
        );

        const ResultBox = ({ label, value, subtext, highlight = false, formula }) => (
            <div className={`
                p-5 rounded-xl border flex flex-col justify-between h-full
                ${highlight 
                    ? 'bg-medical-50/50 dark:bg-medical-900/10 border-medical-100 dark:border-medical-800' 
                    : 'bg-white dark:bg-slate-800/50 border-slate-200 dark:border-slate-700'
                }
            `}>
                <div>
                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{label}</div>
                    <div className={`text-2xl font-bold tracking-tight mb-1 ${highlight ? 'text-medical-600 dark:text-medical-400' : 'text-slate-800 dark:text-slate-100'}`}>
                        {typeof value === 'number' ? value.toLocaleString(undefined, { maximumFractionDigits: 2 }) : value}
                        {subtext && <span className="text-sm font-medium text-slate-400 ml-1.5">{subtext}</span>}
                    </div>
                </div>
                {formula && <FormulaTag>{formula}</FormulaTag>}
            </div>
        );

        // --- Main Application ---
        function App() {
            // Theme State
            const [themeMode, setThemeMode] = useState('system');
            
            useEffect(() => {
                const checkSystem = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
                const applyTheme = () => {
                    const isDark = themeMode === 'system' ? checkSystem() : themeMode === 'dark';
                    if (isDark) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                };
                applyTheme();
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                mq.addEventListener('change', () => themeMode === 'system' && applyTheme());
                return () => mq.removeEventListener('change', () => {});
            }, [themeMode]);

            const [activeTab, setActiveTab] = useState('land');
            
            // --- Global State ---
            const [totalBeds, setTotalBeds] = useState(1000);

            // --- Land Efficiency State ---
            const [plotRatio, setPlotRatio] = useState(2.5);
            const [actualLandArea, setActualLandArea] = useState(60000);
            const [landStdPerBed, setLandStdPerBed] = useState(110);

            // --- Other States ---
            const [outpatientRatio, setOutpatientRatio] = useState(3);
            const [doctorHours, setDoctorHours] = useState(7);
            const [patientsPerHour, setPatientsPerHour] = useState(4);
            const [deptRatios, setDeptRatios] = useState({ internal: 17, surgery: 14, obgyn: 12, pediatrics: 12, ent: 9 });
            const [emergToOutpatientRatio, setEmergToOutpatientRatio] = useState(10);
            const [emergRoomCapacity, setEmergRoomCapacity] = useState(50);
            const [drConfig, setDrConfig] = useState(0.26);
            const [resusRatio, setResusRatio] = useState(20);
            const [resusConfig, setResusConfig] = useState(0.2);
            const [observationRatio, setObservationRatio] = useState(25);
            const [eicuRatioMethod, setEicuRatioMethod] = useState('total');
            const [eicuTotalRatio, setEicuTotalRatio] = useState(1);
            const [eicuResusRatio, setEicuResusRatio] = useState(50);
            const [icuRatio, setIcuRatio] = useState(5);
            const [nicuRatio, setNicuRatio] = useState(10);
            const [obstetricsBeds, setObstetricsBeds] = useState(50);
            const [ccuBeds, setCcuBeds] = useState(10);
            const [bedsPerUnit, setBedsPerUnit] = useState(45);
            const [rooms, setRooms] = useState([{ id: 1, area: 20, count: 10 }]);
            const [trafficCoeff, setTrafficCoeff] = useState(0.35);
            const [wallCoeff, setWallCoeff] = useState(0.10);
            const [wardUnitAreaStandard, setWardUnitAreaStandard] = useState(1650);

            // --- Calculations ---
            const standardLandArea = totalBeds * landStdPerBed;
            const landUseRatio = standardLandArea > 0 ? (actualLandArea / standardLandArea) : 0;
            const efficiencyIndex = plotRatio * landUseRatio;
            
            const layoutType = useMemo(() => {
                const ratioPct = landUseRatio * 100;
                if (ratioPct > 70) return { name: "组团群落式布局", desc: "用地宽裕 (>70%)，容积率较低 (1.5-2)", color: "text-emerald-500", bg: "bg-emerald-500" };
                if (ratioPct > 50) return { name: "高层多层组合半集中式", desc: "用地适中 (50-70%)，容积率中等 (2-3)", color: "text-blue-500", bg: "bg-blue-500" };
                if (ratioPct > 30) return { name: "高层塔楼带裙房基座式", desc: "用地紧凑 (30-50%)，容积率较高 (3-5)", color: "text-indigo-500", bg: "bg-indigo-500" };
                return { name: "高层塔楼集中式布局", desc: "用地紧张 (<30%)，容积率极高 (5-6)", color: "text-purple-500", bg: "bg-purple-500" };
            }, [landUseRatio]);

            const efficiencyStatus = useMemo(() => {
                if (efficiencyIndex >= 1.4 && efficiencyIndex <= 1.5) return { label: "理想值 Ideal", color: "text-emerald-500", ring: "ring-emerald-500" };
                if (efficiencyIndex >= 1.0 && efficiencyIndex <= 2.0) return { label: "合理范围 Rational", color: "text-blue-500", ring: "ring-blue-500" };
                return { label: "需优化 Attention", color: "text-amber-500", ring: "ring-amber-500" };
            }, [efficiencyIndex]);

            // Outpatient & Others Calculations
            const dailyOutpatient = totalBeds * outpatientRatio;
            const singleDocDailyCapacity = doctorHours * patientsPerHour;
            const dailyEmergency = dailyOutpatient * (emergToOutpatientRatio / 100);
            const emergencyRooms = dailyEmergency > 0 ? dailyEmergency / emergRoomCapacity : 0;
            const emergencyEquip = (dailyEmergency / 1000) * drConfig;
            const resusBeds = dailyEmergency * (resusRatio / 100) * resusConfig;
            const obsBeds = dailyEmergency * (observationRatio / 100);
            const eicuBeds = eicuRatioMethod === 'total' ? totalBeds * (eicuTotalRatio / 100) : resusBeds * (eicuResusRatio / 100);
            const icuBedsCalc = totalBeds * (icuRatio / 100);
            const nicuBedsCalc = obstetricsBeds * (nicuRatio / 100);
            const totalSpecialBeds = eicuBeds + icuBedsCalc + nicuBedsCalc + ccuBeds;
            const generalWardBeds = totalBeds - totalSpecialBeds;
            const nursingUnits = generalWardBeds / bedsPerUnit;
            const calculateDeptArea = () => {
                let netArea = 0;
                rooms.forEach(r => netArea += (r.area * r.count));
                return netArea * (1 + trafficCoeff + wallCoeff);
            };
            const deptTotalArea = calculateDeptArea();
            const wardTotalArea = nursingUnits * wardUnitAreaStandard;
            const totalCoeff = 1 + trafficCoeff + wallCoeff;

            const handleRoomChange = (id, field, val) => setRooms(rooms.map(r => r.id === id ? { ...r, [field]: parseFloat(val) || 0 } : r));
            const addRoom = () => setRooms([...rooms, { id: Date.now(), area: 0, count: 0 }]);
            const removeRoom = (id) => setRooms(rooms.filter(r => r.id !== id));

            const tabs = [
                { id: 'land', label: '用地效能', icon: 'Map' },
                { id: 'outpatient', label: '门诊规模', icon: 'Users' },
                { id: 'emergency', label: '急诊配置', icon: 'Activity' },
                { id: 'inpatient', label: '住院病房', icon: 'Bed' },
                { id: 'area', label: '建筑面积', icon: 'Layout' },
            ];

            return (
                <div className="min-h-screen pb-12 animate-fade-in">
                    
                    {/* Header */}
                    <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 bg-opacity-80 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-medical-500 text-white p-1.5 rounded-lg">
                                    <Icon name="Building2" size={20} />
                                </div>
                                <h1 className="font-bold text-lg tracking-tight">医院规划测算计算器 <span className="text-xs font-normal text-slate-400 px-2 py-0.5 bg-slate-100 dark:bg-slate-800 rounded-full">Pro</span></h1>
                            </div>
                            
                            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                                {[
                                    { k: 'light', i: 'Sun' }, 
                                    { k: 'dark', i: 'Moon' }, 
                                    { k: 'system', i: 'Monitor' }
                                ].map(m => (
                                    <button
                                        key={m.k}
                                        onClick={() => setThemeMode(m.k)}
                                        className={`p-1.5 rounded-md transition-all ${themeMode === m.k ? 'bg-white dark:bg-slate-700 shadow-sm text-medical-600 dark:text-medical-400' : 'text-slate-400 hover:text-slate-600'}`}
                                    >
                                        <Icon name={m.i} size={16} />
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 md:px-8 mt-8">
                        
                        {/* Global Input */}
                        <Card className="mb-8 p-6 md:p-8 flex flex-col md:flex-row items-center gap-8 bg-gradient-to-br from-white to-slate-50 dark:from-slate-900 dark:to-slate-800">
                            <div className="flex-1">
                                <div className="flex items-center gap-3 mb-2 text-medical-600 dark:text-medical-400">
                                    <Icon name="Building2" size={24} />
                                    <span className="text-xs font-bold uppercase tracking-wider">Core Parameter</span>
                                </div>
                                <div className="text-4xl font-black text-slate-900 dark:text-white mb-2">医院总床位数</div>
                                <p className="text-slate-500 dark:text-slate-400">所有后续计算的基础指标数据源</p>
                            </div>
                            <div className="w-full md:w-1/3">
                                <div className="relative group">
                                    <input
                                        type="number"
                                        value={totalBeds}
                                        onChange={(e) => setTotalBeds(parseFloat(e.target.value) || 0)}
                                        className="w-full text-5xl font-black text-right bg-transparent border-b-2 border-slate-200 dark:border-slate-700 focus:border-medical-500 outline-none py-2 transition-all placeholder-slate-300 text-slate-900 dark:text-white"
                                    />
                                    <span className="absolute right-0 -bottom-6 text-sm text-slate-400 font-medium">TOTAL BEDS</span>
                                </div>
                            </div>
                        </Card>

                        {/* Navigation */}
                        <div className="flex overflow-x-auto gap-2 mb-8 pb-2 scrollbar-hide">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`
                                        flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap transition-all
                                        ${activeTab === tab.id 
                                            ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-lg' 
                                            : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'}
                                    `}
                                >
                                    <Icon name={tab.icon} size={18} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* Main Content Area */}
                            <div className="lg:col-span-8 space-y-8">
                                
                                {/* 1. LAND EFFICIENCY TAB */}
                                {activeTab === 'land' && (
                                    <div className="animate-fade-in space-y-6">
                                        <Card className="p-6">
                                            <SectionHeader iconName="Map" title="建设用地效能指标" description="效能指标 = 容积率 × (实际用地 / 标准用地)" />
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                                                <div className="space-y-6">
                                                    <div className="p-5 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700">
                                                        <InputGroup label="实际用地面积 (Actual Area)" value={actualLandArea} onChange={setActualLandArea} unit="m²" />
                                                        <InputGroup label="容积率 (FAR)" value={plotRatio} onChange={setPlotRatio} step={0.1} />
                                                    </div>
                                                    <div className="p-5 bg-medical-50/50 dark:bg-medical-900/10 rounded-xl border border-medical-100 dark:border-medical-800/30">
                                                        <InputGroup label="每床建设用地标准" value={landStdPerBed} onChange={setLandStdPerBed} unit="m²/床" hint="参考值: 100~120 m²/床" />
                                                        <div className="mt-3 pt-3 border-t border-medical-200/50 flex justify-between">
                                                            <span className="text-sm text-slate-500">标准用地推算:</span>
                                                            <span className="font-mono font-bold text-slate-700 dark:text-slate-200">{standardLandArea.toLocaleString()} m²</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="flex flex-col gap-4">
                                                    <div className={`flex-1 rounded-2xl p-6 text-white shadow-xl flex flex-col justify-center relative overflow-hidden transition-all duration-500 ${layoutType.bg}`}>
                                                        <div className="absolute top-0 right-0 p-6 opacity-20"><Icon name="Building2" size={120} /></div>
                                                        <div className="relative z-10">
                                                            <div className="text-sm font-medium opacity-90 mb-1">效能指标 (Efficiency Index)</div>
                                                            <div className="text-6xl font-black mb-3 tracking-tighter">{efficiencyIndex.toFixed(2)}</div>
                                                            <div className="inline-flex items-center gap-2 bg-white/20 px-3 py-1.5 rounded-full text-xs font-bold backdrop-blur-md border border-white/20">
                                                                <Icon name="Check" size={12} />
                                                                {efficiencyStatus.label}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <span className="text-xs font-bold text-slate-500 uppercase">用地利用率 (Utilization)</span>
                                                            <span className="font-mono font-bold text-slate-900 dark:text-white">{(landUseRatio * 100).toFixed(1)}%</span>
                                                        </div>
                                                        <div className="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden mb-3">
                                                            <div className={`h-2 rounded-full ${layoutType.bg}`} style={{ width: `${Math.min(landUseRatio * 100, 100)}%` }}></div>
                                                        </div>
                                                        <div className="flex items-start gap-2">
                                                            <div className={`mt-0.5 p-1 rounded-full ${layoutType.bg}`}></div>
                                                            <div>
                                                                <div className="text-sm font-bold text-slate-900 dark:text-white">{layoutType.name}</div>
                                                                <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{layoutType.desc}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                                 <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 text-center">
                                                     <div className="text-[10px] text-slate-400 uppercase font-bold">理想范围</div>
                                                     <div className="text-lg font-bold text-emerald-500">1.4 ~ 1.5</div>
                                                 </div>
                                                 <div className="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 text-center">
                                                     <div className="text-[10px] text-slate-400 uppercase font-bold">合理范围</div>
                                                     <div className="text-lg font-bold text-blue-500">1.0 ~ 2.0</div>
                                                 </div>
                                                 <div className="col-span-2 md:col-span-1 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-xs text-slate-500">
                                                     Formula: FAR × (Actual / Std)
                                                 </div>
                                            </div>
                                        </Card>
                                    </div>
                                )}

                                {/* 2. OUTPATIENT TAB */}
                                {activeTab === 'outpatient' && (
                                    <div className="animate-fade-in space-y-6">
                                        <Card className="p-6">
                                            <SectionHeader iconName="Users" title="门诊规模测算" description="日门诊量 = 总床位 × 诊床比" />
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8 items-start">
                                                <div>
                                                    <InputGroup label="诊床比" value={outpatientRatio} onChange={setOutpatientRatio} step={0.1} hint="国标 3:1 | 热门地区 7:1 | 高端私立 1:1" />
                                                    <div className="p-4 bg-amber-50 dark:bg-amber-900/10 border border-amber-100 dark:border-amber-800/30 rounded-xl mt-4">
                                                        <div className="flex gap-2 text-amber-600 dark:text-amber-400 text-xs font-bold uppercase mb-1">
                                                            <Icon name="Info" size={14} /> 专家建议
                                                        </div>
                                                        <p className="text-xs text-amber-700 dark:text-amber-500 leading-relaxed">新建医院建议按 1.5-2.0 预留发展空间，避免初期空置。</p>
                                                    </div>
                                                </div>
                                                <div className="bg-medical-50 dark:bg-medical-900/10 border border-medical-100 dark:border-medical-800/30 p-6 rounded-2xl text-center">
                                                    <div className="text-sm font-bold text-medical-600 dark:text-medical-400 uppercase tracking-wide mb-2">预估日门诊量</div>
                                                    <div className="text-5xl font-black text-slate-900 dark:text-white mb-2">{dailyOutpatient.toLocaleString()}</div>
                                                    <div className="text-sm text-slate-500">人次 / 日</div>
                                                    <FormulaTag>总床位数({totalBeds}) × 诊床比({outpatientRatio})</FormulaTag>
                                                </div>
                                            </div>
                                            
                                            <div className="border-t border-slate-200 dark:border-slate-800 pt-6">
                                                <h3 className="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wide mb-4">诊室效能</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <InputGroup label="医生日均工作时长 (小时)" value={doctorHours} onChange={setDoctorHours} />
                                                    <InputGroup label="每小时问诊效率 (人/时)" value={patientsPerHour} onChange={setPatientsPerHour} />
                                                </div>
                                            </div>
                                        </Card>
                                    </div>
                                )}

                                {/* 3. EMERGENCY TAB */}
                                {activeTab === 'emergency' && (
                                    <div className="animate-fade-in space-y-6">
                                        <Card className="p-6">
                                            <SectionHeader iconName="Activity" title="急诊资源配置" description="急诊量 = 日门诊量 × 急诊占比" />
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                                <InputGroup label="急诊占比 (%)" value={emergToOutpatientRatio} onChange={setEmergToOutpatientRatio} hint="通常约为 10%" />
                                                <InputGroup label="单间急诊室日均承载 (人)" value={emergRoomCapacity} onChange={setEmergRoomCapacity} />
                                            </div>
                                            
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                                <ResultBox label="日急诊量" value={dailyEmergency} subtext="人次" highlight formula={`门诊 × ${emergToOutpatientRatio}%`} />
                                                <ResultBox label="急诊诊室" value={Math.ceil(emergencyRooms)} subtext="间" formula={`总量 / 承载`} />
                                                <ResultBox label="DR/CT配置" value={emergencyEquip} subtext="台" formula={`(总量/1000) × ${drConfig}`} />
                                                <ResultBox label="抢救床" value={Math.ceil(resusBeds)} subtext="张" formula={`急诊 × ${resusRatio}% × ${resusConfig}`} />
                                            </div>

                                            <div className="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
                                                <h3 className="font-bold text-slate-900 dark:text-white mb-4">EICU (急诊重症) 规划</h3>
                                                <div className="flex gap-4 mb-4">
                                                    <button onClick={() => setEicuRatioMethod('total')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${eicuRatioMethod === 'total' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'bg-white text-slate-600 border border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700'}`}>基于总床位</button>
                                                    <button onClick={() => setEicuRatioMethod('resus')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${eicuRatioMethod === 'resus' ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'bg-white text-slate-600 border border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700'}`}>基于抢救床</button>
                                                </div>
                                                <div className="flex items-end gap-6">
                                                    <div className="flex-1">
                                                        {eicuRatioMethod === 'total' ? (
                                                            <InputGroup label="配置比例 (占总床位)" value={eicuTotalRatio} onChange={setEicuTotalRatio} unit="%" hint="参考: 1%" className="mb-0" />
                                                        ) : (
                                                            <InputGroup label="配置比例 (占抢救床)" value={eicuResusRatio} onChange={setEicuResusRatio} unit="%" hint="参考: 50%" className="mb-0" />
                                                        )}
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-xs font-bold text-slate-400 uppercase">建议床位</div>
                                                        <div className="text-4xl font-black text-slate-900 dark:text-white">{Math.ceil(eicuBeds)}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </Card>
                                    </div>
                                )}

                                {/* 4. INPATIENT TAB */}
                                {activeTab === 'inpatient' && (
                                    <div className="animate-fade-in space-y-6">
                                        <Card className="p-6">
                                            <SectionHeader iconName="Bed" title="住院病房规划" description="普通床位 = 总床位 - 特需床位" />
                                            
                                            <div className="mb-8 p-6 bg-emerald-50 dark:bg-emerald-900/10 border border-emerald-100 dark:border-emerald-900/30 rounded-2xl">
                                                <div className="flex items-center gap-2 mb-4 text-emerald-700 dark:text-emerald-400 font-bold">
                                                    <Icon name="Calculator" size={18} /> 特需床位扣除
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <div>
                                                        <InputGroup label="ICU 配置比例 (%)" value={icuRatio} onChange={setIcuRatio} />
                                                        <div className="flex justify-between text-sm p-2 bg-white dark:bg-slate-800 rounded border border-emerald-100 dark:border-emerald-900/30">
                                                            <span className="text-slate-500">ICU 床位:</span>
                                                            <span className="font-bold text-emerald-600">{Math.ceil(icuBedsCalc)}</span>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <InputGroup label="NICU 重症率 (%)" value={nicuRatio} onChange={setNicuRatio} />
                                                        <div className="flex justify-between text-sm p-2 bg-white dark:bg-slate-800 rounded border border-emerald-100 dark:border-emerald-900/30">
                                                            <span className="text-slate-500">NICU 床位:</span>
                                                            <span className="font-bold text-emerald-600">{Math.ceil(nicuBedsCalc)}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex flex-col md:flex-row gap-8 items-center">
                                                <div className="flex-1 w-full">
                                                    <InputGroup label="标准护理单元床位数" value={bedsPerUnit} onChange={setBedsPerUnit} unit="床/单元" hint="公立: 40-50 | 高端: 25-30" />
                                                </div>
                                                <div className="hidden md:block text-slate-300">
                                                    <Icon name="ArrowRight" size={24} />
                                                </div>
                                                <div className="flex-1 w-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 p-6 rounded-2xl shadow-xl">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="text-xs font-bold opacity-60 uppercase">普通床位</span>
                                                        <span className="font-bold">{Math.floor(generalWardBeds)} 张</span>
                                                    </div>
                                                    <div className="h-1 bg-white/20 dark:bg-slate-200 rounded-full mb-6">
                                                        <div className="h-full bg-medical-500 rounded-full" style={{ width: `${(generalWardBeds/totalBeds)*100}%` }}></div>
                                                    </div>
                                                    <div className="text-xs font-bold opacity-60 uppercase">规划结果</div>
                                                    <div className="text-4xl font-black mt-1">{nursingUnits.toFixed(1)} <span className="text-sm font-medium opacity-60">个护理单元</span></div>
                                                </div>
                                            </div>
                                        </Card>
                                    </div>
                                )}

                                {/* 5. AREA TAB */}
                                {activeTab === 'area' && (
                                    <div className="animate-fade-in space-y-6">
                                        <Card className="p-6">
                                            <SectionHeader iconName="Layout" title="面积空间规划" description="总面积 = 净面积 × (1 + 交通系数 + 墙体系数)" />
                                            
                                            <div className="mb-8 grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700">
                                                <InputGroup label="交通面积系数 Y1t" value={trafficCoeff} onChange={setTrafficCoeff} step={0.01} />
                                                <InputGroup label="墙体面积系数 Y2t" value={wallCoeff} onChange={setWallCoeff} step={0.01} />
                                                <div className="md:col-span-2 flex justify-end items-center gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                                                    <span className="text-sm text-slate-500">综合转换系数 K:</span>
                                                    <span className="text-xl font-bold text-slate-900 dark:text-white bg-white dark:bg-slate-700 px-3 py-1 rounded shadow-sm">{totalCoeff.toFixed(2)}</span>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                <div className="border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                                                    <div className="bg-slate-50 dark:bg-slate-800 p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                                        <h4 className="font-bold text-sm">单一科室测算</h4>
                                                        <button onClick={addRoom} className="text-xs bg-medical-50 text-medical-600 px-2 py-1 rounded font-bold hover:bg-medical-100">+ Add Room</button>
                                                    </div>
                                                    <div className="p-4 space-y-3 max-h-[250px] overflow-y-auto">
                                                        {rooms.map((room, idx) => (
                                                            <div key={room.id} className="flex gap-2 items-center">
                                                                <span className="text-xs text-slate-400 w-4">#{idx+1}</span>
                                                                <input type="number" className="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-2 py-1 text-sm" value={room.area} onChange={(e) => handleRoomChange(room.id, 'area', e.target.value)} placeholder="m²" />
                                                                <span className="text-xs text-slate-400">×</span>
                                                                <input type="number" className="w-16 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-2 py-1 text-sm text-center" value={room.count} onChange={(e) => handleRoomChange(room.id, 'count', e.target.value)} placeholder="Qty" />
                                                                <button onClick={() => removeRoom(room.id)} className="text-slate-400 hover:text-red-500"><Icon name="X" size={14}/></button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="p-4 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-bold text-slate-500 uppercase">总建筑面积 (GFA)</span>
                                                            <span className="text-xl font-bold">{deptTotalArea.toFixed(0)} m²</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6 flex flex-col justify-between">
                                                    <div>
                                                        <h4 className="font-bold text-sm mb-4">住院病区总面积</h4>
                                                        <InputGroup label="单层标准建筑面积" value={wardUnitAreaStandard} onChange={setWardUnitAreaStandard} unit="m²" />
                                                    </div>
                                                    <div className="mt-6 pt-6 border-t border-slate-100 dark:border-slate-700">
                                                        <div className="p-4 bg-medical-600 text-white rounded-xl shadow-md">
                                                            <div className="text-xs opacity-80 uppercase font-bold mb-1">Ward Area Total</div>
                                                            <div className="text-3xl font-black">{wardTotalArea.toLocaleString()} m²</div>
                                                        </div>
                                                        <div className="text-right mt-2 text-xs text-slate-500">
                                                            基于 {nursingUnits.toFixed(1)} 个护理单元
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </Card>
                                    </div>
                                )}
                            </div>

                            {/* Sidebar */}
                            <div className="lg:col-span-4">
                                <div className="sticky top-24 space-y-6">
                                    <Card className="bg-slate-900 text-white border-0 shadow-xl overflow-hidden">
                                        <div className="p-6 bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700">
                                            <h3 className="font-bold flex items-center gap-2">
                                                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                                Realtime Dashboard
                                            </h3>
                                        </div>
                                        <div className="p-6 space-y-6">
                                            <div className="flex justify-between items-end border-b border-slate-700 pb-4">
                                                <span className="text-slate-400 text-sm font-medium">总床位</span>
                                                <span className="text-3xl font-bold leading-none">{totalBeds}</span>
                                            </div>

                                            <div className="space-y-4">
                                                <div className="bg-slate-800 rounded-lg p-3 border border-slate-700">
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="text-slate-400">用地效能</span>
                                                        <span className={`font-mono font-bold ${efficiencyStatus.color}`}>{efficiencyIndex.toFixed(2)}</span>
                                                    </div>
                                                    <div className="h-1 bg-slate-700 rounded-full overflow-hidden">
                                                        <div className={`h-full ${layoutType.bg}`} style={{width: `${Math.min(landUseRatio*100, 100)}%`}}></div>
                                                    </div>
                                                </div>

                                                <div className="bg-slate-800 rounded-lg p-3 border border-slate-700">
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="text-slate-400">日门诊量</span>
                                                        <span className="font-mono font-bold text-medical-400">{dailyOutpatient.toLocaleString()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-2">
                                                <div className="text-[10px] text-slate-500 mb-3 uppercase tracking-widest font-bold">Bed Structure</div>
                                                <div className="space-y-2 text-sm">
                                                    <div className="flex justify-between">
                                                        <span className="text-slate-300">普通病房</span>
                                                        <span className="font-mono font-bold">{Math.floor(generalWardBeds)}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-slate-300">ICU/特需</span>
                                                        <span className="font-mono font-bold text-amber-400">{Math.ceil(totalSpecialBeds)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </Card>

                                    <div className="text-xs text-center text-slate-400">
                                        Design System: Modern Clean v3.0 <br/>
                                        Status: <span className="text-emerald-500">Active</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
